<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bybit Recommender — Панель оператора</title>
  <link rel="stylesheet" href="/static/styles.css"/>
</head>
<body>
  <header class="header">
    <div class="title">Bybit Recommender — Панель оператора</div>
    <div class="meta">
      <div id="regime"></div>
      <button id="refreshBtn" class="btn">Обновить</button>
    </div>
  </header>

  <section class="controls">
    <div class="control">
      <label>Площадка</label>
      <select id="venue">
        <option value="">all</option>
        <option value="spot">spot</option>
        <option value="linear">linear</option>
      </select>
    </div>
    <div class="control">
      <label>Top N</label>
      <input id="topN" type="number" value="20" min="1" max="200"/>
    </div>
    <div class="control">
      <label>Мин. уверенность (для recommended)</label>
      <input id="minConf" type="number" value="0.2" step="0.05" min="0" max="1"/>
    </div>
    <div class="control">
      <label></label>
      <button id="decisionsBtn" class="btn secondary">Журнал</button>
      <button id="riskBtn" class="btn secondary">Риски</button>
    </div>
  <div class="control">
  <label>Показ</label>
  <div class="checks">
    <label class="check"><input type="checkbox" id="showRecommended" checked> recommended</label>
    <label class="check"><input type="checkbox" id="showBlocked"> blocked</label>
    <label class="check"><input type="checkbox" id="showNoTrade"> no_trade</label>
    <label class="check"><input type="checkbox" id="showSuppressed"> suppressed</label>
  </div>
</div>

</section>

  <main class="main">
    <div id="noTrade" class="banner hidden">NO-TRADE: нет рекомендаций со статусом <b>recommended</b> по текущим фильтрам/гейтам.</div>

    <div class="grid">
      <div class="panel">
        <div class="panel-title">Рекомендации</div>
        <table class="table" id="recoTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Площадка</th>
              <th>Symbol</th>
              <th>Bybit bot</th>
              <th>Напр</th>
              <th>Скор</th>
              <th>Увер</th>
              <th>Ож.RR</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="recoBody"></tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-title">Детали</div>
        <div id="details" class="details muted">Выберите рекомендацию.</div>
      </div>
    </div>

    <div class="modal hidden" id="modal">
      <div class="modal-card">
        <div class="modal-header">
          <div id="modalTitle" class="modal-title">Modal</div>
          <button id="modalClose" class="btn tiny">Close</button>
        </div>
        <pre id="modalBody" class="pre"></pre>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
